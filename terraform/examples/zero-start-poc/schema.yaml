title: OCI Database Observability and Security Enablement
description: Resource Manager stack for enabling OCI Database Management, Operations Insights, Data Safe, and Log Analytics prerequisites.
schemaVersion: 1.1.0
version: "20260603"
locale: en

variableGroups:
  - title: Required OCI Scope
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region
  - title: Network
    variables:
      - create_test_network
      - vcn_ocid
      - subnet_ocid
      - test_vcn_cidr
      - test_subnet_cidr
  - title: Optional Targets
    variables:
      - targets
      - ssh_public_keys
  - title: Optional Log Analytics
    variables:
      - enable_log_analytics
      - log_analytics_namespace
      - log_analytics_onboard_namespace
      - log_analytics_log_group_ocid
      - log_analytics_log_group_name
      - log_analytics_create_log_group
      - log_analytics_create_adb_collector
  - title: Disposable Demo Guardrails
    variables:
      - demo_lifecycle_id
      - evidence_retention_days
      - demo_services
      - create_vault
      - ssh_public_keys

variables:
  tenancy_ocid:
    title: Tenancy OCID
    type: oci_tenancy
    required: true

  compartment_ocid:
    title: Target Compartment
    type: oci_compartment
    required: true

  region:
    title: Region
    type: oci_region
    required: true

  create_test_network:
    title: Create Workshop Network
    type: boolean
    default: true

  demo_lifecycle_id:
    title: Unique Demo Lifecycle ID
    type: string
    required: true
    description: Required ownership tag. Use a unique value for every demo so teardown affects only this stack.

  evidence_retention_days:
    title: Sanitized Evidence Retention Days
    type: integer
    default: 7
    required: true
    description: Demo evidence retention target. Do not store credentials or topology in retained evidence.

  demo_services:
    title: Demo Service Pillars
    type: array
    items:
      type: enum
      values:
        - dbm
        - opsi
        - datasafe
        - logan
    default:
      - dbm
      - opsi
      - datasafe
      - logan
    required: true
    description: Select the OCI services to demonstrate. DB-side accounts, Vault secrets, firewall rules, and readiness checks are required before service enablement.

  create_vault:
    title: Create Disposable Vault and KMS Key
    type: boolean
    default: true
    description: Creates lifecycle-managed Vault/KMS resources for demo role secrets. Never put plaintext credential values in stack variables.

  vcn_ocid:
    title: Existing VCN OCID
    type: oci_vcn
    required: false
    dependsOn:
      create_test_network: false

  subnet_ocid:
    title: Existing Private Subnet OCID
    type: oci_subnet
    required: false
    dependsOn:
      create_test_network: false

  test_vcn_cidr:
    title: Workshop VCN CIDR
    type: string
    required: false

  test_subnet_cidr:
    title: Workshop Private Subnet CIDR
    type: string
    required: false

  targets:
    title: Target Descriptor List
    type: text
    multiline: true
    required: false
    description: JSON target descriptors generated by dbman-opsi. Keep credentials in Vault or environment variables, not in this field.

  ssh_public_keys:
    title: SSH Public Keys
    type: array
    items:
      type: string
    required: false

  enable_log_analytics:
    title: Enable Log Analytics Intent
    type: boolean
    default: false

  log_analytics_namespace:
    title: Existing Log Analytics Namespace
    type: string
    required: false

  log_analytics_onboard_namespace:
    title: Onboard Log Analytics Namespace In CLI Workflow
    type: boolean
    default: false

  log_analytics_log_group_ocid:
    title: Existing Log Analytics Log Group OCID
    type: string
    required: false

  log_analytics_log_group_name:
    title: Log Analytics Log Group Name
    type: string
    default: dbman-opsi-logan

  log_analytics_create_log_group:
    title: Create Or Reuse Log Analytics Log Group In CLI Workflow
    type: boolean
    default: true

  log_analytics_create_adb_collector:
    title: Reserve Private ADB Collector Host Intent
    type: boolean
    default: false
